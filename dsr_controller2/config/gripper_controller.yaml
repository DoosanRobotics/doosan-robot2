# gripper_controller.yaml
# 최상위 "/**" 는 name 네임스페이스(예: /dsr01) 와 무관하게 적용하기 위한 것 (Lyrical 의 spawner --param-file 이 요구)

/**:
  controller_manager:
    ros__parameters:
      gripper_position_controller:
        type: parallel_gripper_action_controller/GripperActionController

  gripper_position_controller:
    ros__parameters:
      action_monitor_rate: 20.0
      allow_stalling: true
      goal_tolerance: 0.01
      joint: "robotiq_85_left_knuckle_joint"
      max_effort: 100.0
      stall_timeout: 3.0
      stall_velocity_threshold: 0.001
